<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Đăng Ký Tài Khoản – Sân Bóng Nhà Máy Nước Yên Phú</title>
  
  <!-- Google Fonts: Space Grotesk & Anybody -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CDN & Cấu hình Theme chung -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary selection:text-on-primary">
  
  <!-- TOP FIXED HEADER -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/85 backdrop-blur-xl shadow-[0_1px_16px_rgba(0,0,0,0.5)]">
    <div class="h-20 px-margin flex items-center justify-between gap-space-sm max-w-4xl mx-auto">
      <a href="index.html" class="flex items-center gap-space-sm min-w-0">
        <img alt="Logo Sói Vàng Nhà Máy Nước Yên Phú" class="h-8 w-auto object-contain flex-shrink-0" src="assets/images/439343273_122140387460152065_8998464398296772982_n.jpg"/>
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-space-xs">
            <span class="font-headline-sm text-headline-sm text-primary uppercase tracking-tight truncate">Nhà Máy Nước</span>
            <span class="text-outline font-label-sm text-label-sm">•</span>
            <span class="font-headline-sm text-headline-sm text-on-surface uppercase tracking-tight truncate">Yên Phú</span>
          </div>
          <span class="font-label-sm text-[11px] text-outline-variant">Hệ Thống Đặt Sân Bóng Đá</span>
        </div>
      </a>
      <a href="index.html" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm transition-colors">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span>Trang Chủ</span>
      </a>
    </div>
  </header>

  <!-- MAIN REGISTER FORM VIEWPORT -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 pt-28 pb-12 w-full">
    <div class="w-full max-w-md bg-surface-container rounded-2xl p-6 sm:p-8 shadow-2xl border border-surface-container-high/80 relative overflow-hidden">
      <!-- Glow accent -->
      <div class="absolute -right-12 -top-12 w-40 h-40 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="text-center mb-6 relative z-10">
        <div class="w-16 h-16 rounded-full bg-surface-container-highest p-1 mx-auto mb-3 flex items-center justify-center shadow-lg border border-primary/20">
          <span class="material-symbols-outlined text-primary text-[32px]">person_add</span>
        </div>
        <h1 class="font-headline-md text-headline-md text-on-surface uppercase tracking-tight">Đăng Ký Tài Khoản</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
          Tạo tài khoản để giữ chỗ sân nhanh chóng và nhận ưu đãi đội bóng
        </p>
      </div>

      <!-- Alert Box for Error / Success -->
      <div id="auth-alert" class="hidden mb-4 p-3.5 rounded-DEFAULT bg-error-container/20 border border-error/30 text-error flex items-start gap-2.5">
        <span class="material-symbols-outlined text-[20px] flex-shrink-0 mt-0.5" id="auth-alert-icon">error</span>
        <div class="text-xs sm:text-sm font-medium leading-relaxed" id="auth-alert-msg">Thông báo lỗi</div>
      </div>

      <!-- Register Form -->
      <form id="register-form" class="space-y-3.5 relative z-10" onsubmit="event.preventDefault(); handleRegister();">
        <!-- Full Name -->
        <div class="space-y-1">
          <label class="font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider flex items-center gap-1" for="reg-name">
            <span>Họ và Tên</span>
            <span class="text-primary">*</span>
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">badge</span>
            <input 
              class="w-full h-11 pl-11 pr-4 bg-surface-container-lowest text-on-surface rounded-DEFAULT font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary border border-transparent transition-all" 
              id="reg-name" 
              placeholder="Ví dụ: Nguyễn Văn Tuấn" 
              required 
              type="text" 
            />
          </div>
        </div>

        <!-- Phone Number -->
        <div class="space-y-1">
          <label class="font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider flex items-center gap-1" for="reg-phone">
            <span>Số Điện Thoại (Dùng để đăng nhập)</span>
            <span class="text-primary">*</span>
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">phone_iphone</span>
            <input 
              class="w-full h-11 pl-11 pr-4 bg-surface-container-lowest text-on-surface rounded-DEFAULT font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary border border-transparent transition-all" 
              id="reg-phone" 
              placeholder="0988xxxxxx (9 đến 15 số)" 
              required 
              type="tel" 
            />
          </div>
        </div>

        <!-- Email (Optional) -->
        <div class="space-y-1">
          <label class="font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider flex items-center gap-1" for="reg-email">
            <span>Email</span>
            <span class="text-outline text-[11px] lowercase">(tùy chọn)</span>
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">mail</span>
            <input 
              class="w-full h-11 pl-11 pr-4 bg-surface-container-lowest text-on-surface rounded-DEFAULT font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary border border-transparent transition-all" 
              id="reg-email" 
              placeholder="email@example.com" 
              type="email" 
            />
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-1">
          <label class="font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider flex items-center gap-1" for="reg-password">
            <span>Mật Khẩu</span>
            <span class="text-primary">*</span>
            <span class="text-outline text-[11px]">(tối thiểu 6 ký tự)</span>
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">key</span>
            <input 
              class="w-full h-11 pl-11 pr-11 bg-surface-container-lowest text-on-surface rounded-DEFAULT font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary border border-transparent transition-all" 
              id="reg-password" 
              placeholder="Nhập mật khẩu an toàn..." 
              required 
              minlength="6"
              type="password" 
            />
            <button type="button" onclick="togglePasswordVisibility('reg-password', this)" class="absolute right-3.5 text-on-surface-variant hover:text-on-surface transition-colors">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="space-y-1">
          <label class="font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider flex items-center gap-1" for="reg-confirm-password">
            <span>Xác Nhận Mật Khẩu</span>
            <span class="text-primary">*</span>
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">check_circle</span>
            <input 
              class="w-full h-11 pl-11 pr-11 bg-surface-container-lowest text-on-surface rounded-DEFAULT font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary border border-transparent transition-all" 
              id="reg-confirm-password" 
              placeholder="Nhập lại mật khẩu..." 
              required 
              minlength="6"
              type="password" 
            />
            <button type="button" onclick="togglePasswordVisibility('reg-confirm-password', this)" class="absolute right-3.5 text-on-surface-variant hover:text-on-surface transition-colors">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-3">
          <button 
            type="submit" 
            id="btn-register-submit" 
            class="w-full h-12 rounded-full bg-primary hover:bg-primary-fixed-dim text-on-primary font-headline-sm text-headline-sm uppercase tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-all disabled:opacity-50"
          >
            <span class="material-symbols-outlined text-[20px]" id="btn-register-icon">person_add</span>
            <span id="btn-register-text">Tạo Tài Khoản Thành Viên</span>
          </button>
        </div>
      </form>

      <!-- Switch to Login -->
      <div class="mt-6 text-center border-t border-surface-container-highest/60 pt-4">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Đã có tài khoản? 
          <a id="login-link" href="login.html" class="text-primary font-bold hover:underline ml-1">Đăng Nhập Ngay</a>
        </p>
      </div>
    </div>
  </main>

  <!-- External JavaScript Files -->
  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Chuyển tiếp tham số redirect sang link đăng nhập
      const loginLink = document.getElementById("login-link");
      if (loginLink && window.location.search) {
        loginLink.href = `login.html${window.location.search}`;
      }
    });

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector(".material-symbols-outlined");
      if (!input || !icon) return;
      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "visibility_off";
      } else {
        input.type = "password";
        icon.textContent = "visibility";
      }
    }

    async function handleRegister() {
      const nameInput = document.getElementById("reg-name");
      const phoneInput = document.getElementById("reg-phone");
      const emailInput = document.getElementById("reg-email");
      const passwordInput = document.getElementById("reg-password");
      const confirmInput = document.getElementById("reg-confirm-password");

      const btnSubmit = document.getElementById("btn-register-submit");
      const btnText = document.getElementById("btn-register-text");
      const btnIcon = document.getElementById("btn-register-icon");
      const alertBox = document.getElementById("auth-alert");
      const alertMsg = document.getElementById("auth-alert-msg");
      const alertIcon = document.getElementById("auth-alert-icon");

      const name = nameInput ? nameInput.value.trim() : "";
      const phone = phoneInput ? phoneInput.value.trim().replace(/\s+/g, "") : "";
      const email = emailInput ? emailInput.value.trim() : "";
      const password = passwordInput ? passwordInput.value : "";
      const confirmPassword = confirmInput ? confirmInput.value : "";

      // 1. Kiểm tra Họ và Tên (>= 2 ký tự)
      if (!name || name.length < 2) {
        alert("Vui lòng nhập Họ và Tên (tối thiểu 2 ký tự)!");
        if (nameInput) nameInput.focus();
        return;
      }

      // 2. Kiểm tra Số điện thoại (9 đến 15 chữ số)
      const phoneRegex = /^[0-9]{9,15}$/;
      if (!phone || !phoneRegex.test(phone)) {
        alert("Số điện thoại không hợp lệ! Vui lòng nhập từ 9 đến 15 chữ số.");
        if (phoneInput) phoneInput.focus();
        return;
      }

      // 3. Kiểm tra Email nếu có
      if (email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          alert("Địa chỉ Email không đúng định dạng!");
          if (emailInput) emailInput.focus();
          return;
        }
      }

      // 4. Kiểm tra Mật khẩu (>= 6 ký tự)
      if (!password || password.length < 6) {
        alert("Mật khẩu phải có tối thiểu 6 ký tự!");
        if (passwordInput) passwordInput.focus();
        return;
      }

      // 5. Kiểm tra Xác nhận mật khẩu khớp
      if (password !== confirmPassword) {
        alert("Xác nhận mật khẩu không khớp! Vui lòng kiểm tra lại.");
        if (confirmInput) confirmInput.focus();
        return;
      }

      // Hiển thị trạng thái đang xử lý
      alertBox.classList.add("hidden");
      btnSubmit.disabled = true;
      btnText.textContent = "ĐANG TẠO TÀI KHOẢN...";
      btnIcon.textContent = "progress_activity";
      btnIcon.classList.add("animate-spin");

      try {
        const payload = {
          full_name: name,
          phone: phone,
          password: password,
          email: email || undefined
        };

        // Gửi API đăng ký lên Backend
        await API.register(payload);

        // Hiển thị thông báo thành công
        alertBox.className = "mb-4 p-3.5 rounded-DEFAULT bg-primary/20 border border-primary/40 text-primary flex items-start gap-2.5";
        alertIcon.textContent = "check_circle";
        alertMsg.textContent = "Đăng ký thành công! Đang tự động đăng nhập...";
        alertBox.classList.remove("hidden");

        // Tự động đăng nhập luôn sau khi đăng ký
        const loginRes = await API.login({
          login_id: phone,
          password: password
        });

        // Điều hướng tiếp theo
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get("redirect");

        setTimeout(() => {
          if (redirectUrl) {
            window.location.href = redirectUrl;
          } else {
            window.location.href = "index.html";
          }
        }, 1200);

      } catch (error) {
        alertBox.className = "mb-4 p-3.5 rounded-DEFAULT bg-error-container/20 border border-error/30 text-error flex items-start gap-2.5";
        alertIcon.textContent = "error";
        alertMsg.textContent = error.message || "Đăng ký không thành công. Vui lòng thử lại!";
        alertBox.classList.remove("hidden");
        btnSubmit.disabled = false;
        btnText.textContent = "Tạo Tài Khoản Thành Viên";
        btnIcon.textContent = "person_add";
        btnIcon.classList.remove("animate-spin");
      }
    }
  </script>
</body>
</html>
