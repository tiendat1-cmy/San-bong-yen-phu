<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Đăng Nhập – Sân Bóng Nhà Máy Nước Yên Phú</title>
  
  <!-- Google Fonts: Space Grotesk & Anybody -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CDN & Cấu hình Theme chung -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary selection:text-on-primary">
  
  <!-- TOP FIXED HEADER -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/85 backdrop-blur-xl shadow-[0_1px_16px_rgba(0,0,0,0.5)]">
    <div class="h-20 px-margin flex items-center justify-between gap-space-sm max-w-4xl mx-auto">
      <a href="index.html" class="flex items-center gap-space-sm min-w-0">
        <img alt="Logo Sói Vàng Nhà Máy Nước Yên Phú" class="h-8 w-auto object-contain flex-shrink-0" src="assets/images/439343273_122140387460152065_8998464398296772982_n.jpg"/>
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-space-xs">
            <span class="font-headline-sm text-headline-sm text-primary uppercase tracking-tight truncate">Nhà Máy Nước</span>
            <span class="text-outline font-label-sm text-label-sm">•</span>
            <span class="font-headline-sm text-headline-sm text-on-surface uppercase tracking-tight truncate">Yên Phú</span>
          </div>
          <span class="font-label-sm text-[11px] text-outline-variant">Hệ Thống Đặt Sân Bóng Đá</span>
        </div>
      </a>
      <a href="index.html" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm transition-colors">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span>Trang Chủ</span>
      </a>
    </div>
  </header>

  <!-- MAIN LOGIN FORM VIEWPORT -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 pt-28 pb-12 w-full">
    <div class="w-full max-w-md bg-surface-container rounded-2xl p-6 sm:p-8 shadow-2xl border border-surface-container-high/80 relative overflow-hidden">
      <!-- Glow accent -->
      <div class="absolute -right-12 -top-12 w-40 h-40 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="text-center mb-6 relative z-10">
        <div class="w-16 h-16 rounded-full bg-surface-container-highest p-1 mx-auto mb-3 flex items-center justify-center shadow-lg border border-primary/20">
          <span class="material-symbols-outlined text-primary text-[32px]">lock</span>
        </div>
        <h1 class="font-headline-md text-headline-md text-on-surface uppercase tracking-tight">Đăng Nhập Tài Khoản</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-1" id="login-subtext">
          Đăng nhập để đặt sân, giữ chỗ và theo dõi lịch thi đấu
        </p>
      </div>

      <!-- Alert Box for Error / Expired Notice -->
      <div id="auth-alert" class="hidden mb-4 p-3.5 rounded-DEFAULT bg-error-container/20 border border-error/30 text-error flex items-start gap-2.5">
        <span class="material-symbols-outlined text-[20px] flex-shrink-0 mt-0.5">error</span>
        <div class="text-xs sm:text-sm font-medium leading-relaxed" id="auth-alert-msg">Thông báo lỗi</div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4 relative z-10" onsubmit="event.preventDefault(); handleLogin();">
        <!-- Phone or Email Input -->
        <div class="space-y-1">
          <label class="font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider flex items-center gap-1" for="login-id">
            <span>Số Điện Thoại Hoặc Email</span>
            <span class="text-primary">*</span>
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">person</span>
            <input 
              class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface rounded-DEFAULT font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary border border-transparent transition-all" 
              id="login-id" 
              placeholder="0988xxxxxx hoặc email@domain.com" 
              required 
              type="text" 
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1">
          <div class="flex items-center justify-between">
            <label class="font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider flex items-center gap-1" for="login-password">
              <span>Mật Khẩu</span>
              <span class="text-primary">*</span>
            </label>
          </div>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">key</span>
            <input 
              class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest text-on-surface rounded-DEFAULT font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary border border-transparent transition-all" 
              id="login-password" 
              placeholder="Nhập mật khẩu của bạn..." 
              required 
              type="password" 
            />
            <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute right-3.5 text-on-surface-variant hover:text-on-surface transition-colors">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="btn-login-submit" 
            class="w-full h-12 rounded-full bg-primary hover:bg-primary-fixed-dim text-on-primary font-headline-sm text-headline-sm uppercase tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-all disabled:opacity-50"
          >
            <span class="material-symbols-outlined text-[20px]" id="btn-login-icon">login</span>
            <span id="btn-login-text">Đăng Nhập Ngay</span>
          </button>
        </div>
      </form>

      <!-- Switch to Register -->
      <div class="mt-6 text-center border-t border-surface-container-highest/60 pt-4">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Chưa có tài khoản? 
          <a id="register-link" href="register.html" class="text-primary font-bold hover:underline ml-1">Đăng Ký Miễn Phí</a>
        </p>
      </div>

      <!-- Test Accounts Quick Fill Card -->
      
    </div>
  </main>

  <!-- External JavaScript Files -->
  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      
      // Chuyển tiếp tham số redirect sang link đăng ký
      const regLink = document.getElementById("register-link");
      if (regLink && window.location.search) {
        regLink.href = `register.html${window.location.search}`;
      }

      // Kiểm tra thông báo phiên hết hạn hoặc yêu cầu đăng nhập
      const alertBox = document.getElementById("auth-alert");
      const alertMsg = document.getElementById("auth-alert-msg");
      if (urlParams.get("expired")) {
        alertMsg.textContent = "Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại để tiếp tục!";
        alertBox.classList.remove("hidden");
      } else if (urlParams.get("redirect") && urlParams.get("redirect").includes("booking.html")) {
        alertMsg.textContent = "Vui lòng đăng nhập tài khoản trước khi hoàn tất đặt sân!";
        alertBox.classList.remove("hidden");
        alertBox.className = "mb-4 p-3.5 rounded-DEFAULT bg-primary/10 border border-primary/30 text-primary flex items-start gap-2.5";
      } else if (urlParams.get("error") === "unauthorized") {
        alertMsg.textContent = "Bạn cần đăng nhập với tài khoản Quản trị viên (Admin) để vào trang này!";
        alertBox.classList.remove("hidden");
      }
    });

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector(".material-symbols-outlined");
      if (!input || !icon) return;
      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "visibility_off";
      } else {
        input.type = "password";
        icon.textContent = "visibility";
      }
    }


    async function handleLogin() {
      const loginIdInput = document.getElementById("login-id");
      const passwordInput = document.getElementById("login-password");
      const btnSubmit = document.getElementById("btn-login-submit");
      const btnText = document.getElementById("btn-login-text");
      const btnIcon = document.getElementById("btn-login-icon");
      const alertBox = document.getElementById("auth-alert");
      const alertMsg = document.getElementById("auth-alert-msg");

      const loginId = loginIdInput ? loginIdInput.value.trim() : "";
      const password = passwordInput ? passwordInput.value : "";

      if (!loginId) {
        alert("Vui lòng nhập Số điện thoại hoặc Email!");
        if (loginIdInput) loginIdInput.focus();
        return;
      }
      if (!password) {
        alert("Vui lòng nhập Mật khẩu!");
        if (passwordInput) passwordInput.focus();
        return;
      }

      // Hiển thị trạng thái đang tải
      alertBox.classList.add("hidden");
      btnSubmit.disabled = true;
      btnText.textContent = "ĐANG XÁC THỰC...";
      btnIcon.textContent = "progress_activity";
      btnIcon.classList.add("animate-spin");

      try {
        const response = await API.login({
          login_id: loginId,
          password: password
        });

        // Đăng nhập thành công -> Điều hướng đúng theo quyền hoặc theo tham số redirect
        const user = response.user;
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get("redirect");

        if (redirectUrl) {
          // Nếu có yêu cầu quay lại luồng trước đó (ví dụ: booking.html)
          window.location.href = redirectUrl;
        } else if (user.role === "admin") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "index.html";
        }
      } catch (error) {
        alertMsg.textContent = error.message || "Đăng nhập thất bại. Vui lòng kiểm tra lại thông tin!";
        alertBox.className = "mb-4 p-3.5 rounded-DEFAULT bg-error-container/20 border border-error/30 text-error flex items-start gap-2.5";
        alertBox.classList.remove("hidden");
      } finally {
        btnSubmit.disabled = false;
        btnText.textContent = "Đăng Nhập Ngay";
        btnIcon.textContent = "login";
        btnIcon.classList.remove("animate-spin");
      }
    }
  </script>
</body>
</html>
